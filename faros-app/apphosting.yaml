# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0

env:
  # Variables públicas del SDK de Firebase (cliente)
  # Estas NO son secretos — son la config del proyecto que el navegador necesita.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyDjNKDQYfoDs7pggy9BRvff3r7uke-2jGM
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: faros-training-center.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: faros-training-center
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: faros-training-center.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "951817703141"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:951817703141:web:d9448eedfdf904b210ce0c
    availability:
      - BUILD
      - RUNTIME
